# ===========================================================
# GitHub Actions Workflow: Build & Test Go Project (myDb)
# ===========================================================

name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Go (lấy version từ go.mod)
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: true

      # Download dependencies
      - name: Download dependencies
        run: go mod download

      # Auto format (prevent CI fail)
      - name: Auto format Go code
        run: gofmt -w .

      # Check formatting (ensure no missing fmt)
      - name: Format check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      # Lint
      - name: Vet
        run: go vet ./...

      # Build main daemon
      - name: Build mydbd
        run: go build -o mydbd ./cmd/mydbd

      # Run unit tests
      - name: Test
        run: go test -v ./...

      # Upload binary artifact
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydbd-binary
          path: mydbd
